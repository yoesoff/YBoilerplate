spring.application.name=YBoilerplate
management.endpoints.web.exposure.include=*
spring.datasource.url=jdbc:mysql://localhost:3306/yboilerplate
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Liquibase configurations
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.database-change-log-lock-table=DBCHANGELOGLOCK
spring.liquibase.database-change-log-table=DBCHANGELOG
spring.liquibase.drop-first=true